<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - Kerajaan Sang Buaya</title>
    
    <!-- 1. Load A-Frame 1.4.2 (More stable with MindAR 1.2.5) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- 2. Load MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- 3. Load A-Frame Extras (For animation-mixer) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Core UI Styles to ensure visibility even if style.css fails */
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        
        .main-header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(255, 255, 255, 0.9); box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .nav-menu {
            list-style: none; display: flex; justify-content: center; padding: 10px; margin: 0;
        }
        
        .nav-menu li { margin: 0 10px; }
        .nav-link { text-decoration: none; color: #333; font-weight: bold; }
        .nav-link.active { color: #2E7D32; }

        /* Home Content */
        #home-screen {
            padding-top: 80px; min-height: 100vh;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex; justify-content: center; align-items: center;
        }
        
        .home-content {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            max-width: 1200px; width: 100%; padding: 20px;
        }

        .content-left { flex: 1; min-width: 300px; text-align: center; padding: 20px; }
        .content-right { flex: 1; min-width: 300px; text-align: center; padding: 20px; }

        .main-title { font-size: 3rem; color: #2E7D32; margin-bottom: 10px; line-height: 1.2; }
        .subtitle { font-size: 1.2rem; color: #555; margin-bottom: 30px; }
        
        .button-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .action-btn {
            padding: 12px 25px; border: none; border-radius: 25px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: transform 0.2s; text-decoration: none; display: inline-block;
        }
        .action-btn:hover { transform: scale(1.05); }
        .btn-yellow { background: #FFD700; color: #000; }
        .btn-blue { background: #0288D1; color: white; }

        .book-3d { max-width: 80%; box-shadow: 10px 10px 20px rgba(0,0,0,0.3); border-radius: 5px; transform: rotateY(-15deg); }

        /* Audio Links Section */
        .audio-links {
            margin: 30px auto 0; padding: 15px; background: rgba(255, 255, 255, 0.6);
            border-radius: 12px; border-left: 5px solid #CF7A00; width: 100%; max-width: 400px; box-sizing: border-box;
        }
        .audio-links h2 { margin-top: 0; font-size: 1.1rem; margin-bottom: 10px; color: #CF7A00; }
        .audio-links-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .audio-link-item {
            display: inline-block; padding: 8px 12px; background: white; color: #333; text-decoration: none;
            border-radius: 8px; font-weight: bold; font-size: 0.85rem; border: 1px solid #ddd;
            cursor: pointer; transition: background 0.2s;
        }
        .audio-link-item:hover, .audio-link-item.active-lang { background: #FFD700; color: #000; border-color: #CF7A00; }
        
        /* AR UI Overlays */
        .ar-audio-controls {
            position: absolute; top: 80px; right: 10px; z-index: 1000;
            display: flex; flex-direction: column; gap: 10px; background: rgba(0, 0, 0, 0.6);
            padding: 10px; border-radius: 10px; backdrop-filter: blur(5px);
        }
        .ar-label { color: white; font-size: 12px; text-align: center; margin-bottom: 5px; font-weight: bold; }
