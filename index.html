<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - Kerajaan Sang Buaya</title>
    
    <!-- 1. Load A-Frame 1.4.2 (More stable with MindAR 1.2.5) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- 2. Load MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- 3. Load A-Frame Extras (For animation-mixer) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Core UI Styles to ensure visibility even if style.css fails */
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        
        .main-header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(255, 255, 255, 0.9); box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .nav-menu {
            list-style: none; display: flex; justify-content: center; padding: 10px; margin: 0;
        }
        
        .nav-menu li { margin: 0 10px; }
        .nav-link { text-decoration: none; color: #333; font-weight: bold; }
        .nav-link.active { color: #2E7D32; }

        /* Home Content */
        #home-screen {
            padding-top: 80px; min-height: 100vh;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex; justify-content: center; align-items: center;
        }
        
        .home-content {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            max-width: 1200px; width: 100%; padding: 20px;
        }

        .content-left { flex: 1; min-width: 300px; text-align: center; padding: 20px; }
        .content-right { flex: 1; min-width: 300px; text-align: center; padding: 20px; }

        .main-title { font-size: 3rem; color: #2E7D32; margin-bottom: 10px; line-height: 1.2; }
        .subtitle { font-size: 1.2rem; color: #555; margin-bottom: 30px; }
        
        .button-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .action-btn {
            padding: 12px 25px; border: none; border-radius: 25px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: transform 0.2s; text-decoration: none; display: inline-block;
        }
        .action-btn:hover { transform: scale(1.05); }
        .btn-yellow { background: #FFD700; color: #000; }
        .btn-blue { background: #0288D1; color: white; }

        .book-3d { max-width: 80%; box-shadow: 10px 10px 20px rgba(0,0,0,0.3); border-radius: 5px; transform: rotateY(-15deg); }

        /* Audio Links Section */
        .audio-links {
            margin: 30px auto 0; padding: 15px; background: rgba(255, 255, 255, 0.6);
            border-radius: 12px; border-left: 5px solid #CF7A00; width: 100%; max-width: 400px; box-sizing: border-box;
        }
        .audio-links h2 { margin-top: 0; font-size: 1.1rem; margin-bottom: 10px; color: #CF7A00; }
        .audio-links-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .audio-link-item {
            display: inline-block; padding: 8px 12px; background: white; color: #333; text-decoration: none;
            border-radius: 8px; font-weight: bold; font-size: 0.85rem; border: 1px solid #ddd;
            cursor: pointer; transition: background 0.2s;
        }
        .audio-link-item:hover, .audio-link-item.active-lang { background: #FFD700; color: #000; border-color: #CF7A00; }
        
        /* AR UI Overlays */
        .ar-audio-controls {
            position: absolute; top: 80px; right: 10px; z-index: 1000;
            display: flex; flex-direction: column; gap: 10px; background: rgba(0, 0, 0, 0.6);
            padding: 10px; border-radius: 10px; backdrop-filter: blur(5px);
        }
        .ar-label { color: white; font-size: 12px; text-align: center; margin-bottom: 5px; font-weight: bold; }
        .ar-btn {
            background: rgba(255, 255, 255, 0.9); border: none; padding: 8px 12px; border-radius: 20px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .ar-btn.active-lang { background: #FFD700; color: #000; border: 2px solid white; }
        
        #ar-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; pointer-events: none; }
        #ar-ui > * { pointer-events: auto; }
        
        /* Hide home screen when AR is active */
        body.ar-active { background: transparent !important; }
        body.ar-active #home-screen { display: none; }
        body.ar-active .main-header { display: none; }
        
        /* Loading Overlay */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            z-index: 2000; display: none; justify-content: center; align-items: center; flex-direction: column; color: white;
        }
        .loader {
            border: 5px solid #f3f3f3; border-top: 5px solid #FFD700; border-radius: 50%;
            width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="main-header">
        <nav>
             <ul class="nav-menu">
                <li><a href="index.html" class="nav-link active" data-i18n="nav_home">Home</a></li>
                <li><a href="synopsis.html" class="nav-link" data-i18n="nav_synopsis">Synopsis</a></li>
                <li><a href="video.html" class="nav-link" data-i18n="nav_video">Video</a></li>
                <li><a href="biodata.html" class="nav-link" data-i18n="nav_biodata">Biodata</a></li>
                <li><a href="contact.html" class="nav-link" data-i18n="nav_contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Custom Loading Screen -->
    <div id="loading-overlay">
        <div class="loader"></div>
        <div id="loading-text">Starting AR...</div>
    </div>

    <div id="home-screen">
        <div class="home-content">
            <div class="content-left">
                <h1 class="main-title" data-i18n="home_title">Kerajaan<br>Sang Buaya</h1>
                <p class="subtitle" data-i18n="home_subtitle">Scan the images to see the story come alive!</p>
                
                <div class="button-group">
                    <button class="action-btn btn-yellow" onclick="startAR()" data-i18n="btn_scan">📷 SCAN AR</button>
                    <a href="https://online.fliphtml5.com/szolx/xdbu/" target="_blank" class="action-btn btn-blue" data-i18n="btn_read">📚 READ E-BOOK</a>
                </div>

                <div class="audio-links">
                    <h2>Language / Bahasa:</h2>
                    <div class="audio-links-grid">
                        <div onclick="switchSiteLanguage('en')" class="audio-link-item lang-btn" id="lang-btn-en">🇬🇧 English</div>
                        <div onclick="switchSiteLanguage('ms')" class="audio-link-item lang-btn" id="lang-btn-ms">🇲🇾 Melayu</div>
                        <div onclick="switchSiteLanguage('du')" class="audio-link-item lang-btn" id="lang-btn-du">🌾 Dusun</div>
                    </div>
                </div>
            </div>
            <div class="content-right">
                <!-- Fallback if image missing -->
                <div class="book-wrapper">
                    <img src="Bookcoverpage.jpeg" alt="Book Cover" class="book-3d" onerror="this.style.display='none';">
                </div>
            </div>
        </div>
    </div>

    <div id="ar-ui" style="display: none;">
        <div class="top-bar" style="position:absolute; top:10px; left:10px;">
            <button class="back-btn" onclick="stopAR()" style="padding:10px 20px; background:#e74c3c; color:white; border:none; border-radius:25px; font-weight:bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">⬅ Back to Home</button>
        </div>
        
        <div class="ar-audio-controls">
            <div id="audio-status" class="ar-label">Audio: English</div>
            <button class="ar-btn active-lang" id="btn-audio-en" onclick="changeAudioLang('BI')">🇬🇧 EN</button>
            <button class="ar-btn" id="btn-audio-ms" onclick="changeAudioLang('BM')">🇲🇾 BM</button>
            <button class="ar-btn" id="btn-audio-du" onclick="changeAudioLang('BKD')">🌾 DUS</button>
        </div>
    </div>

    <!-- 
      FIXES:
      1. uiLoading: no -> Prevents the 'showLoading' undefined error.
      2. uiScanning: no -> We rely on auto detection, no scan UI needed.
      3. autoStart: false -> We start it manually via button.
      4. timeout="30000" -> Increased asset timeout to 30 seconds.
    -->
    <a-scene mindar-image="imageTargetSrc: assets/targets/Buaya.mind; autoStart: false; uiScanning: no; uiLoading: no;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets timeout="30000">
            <a-asset-item id="model-1" src="assets/models/scene1.glb"></a-asset-item>
            <a-asset-item id="model-2" src="assets/models/scene2.glb"></a-asset-item>
            <a-asset-item id="model-3" src="assets/models/scene3.glb"></a-asset-item>
            <a-asset-item id="model-4" src="assets/models/scene4.glb"></a-asset-item>
            <a-asset-item id="model-5" src="assets/models/scene5.glb"></a-asset-item>
            <a-asset-item id="model-6" src="assets/models/scene6.glb"></a-asset-item>
            <a-asset-item id="model-7" src="assets/models/scene7.glb"></a-asset-item>
            <a-asset-item id="model-8" src="assets/models/scene8.glb"></a-asset-item>
            <a-asset-item id="model-9" src="assets/models/scene9.glb"></a-asset-item>
            <a-asset-item id="model-10" src="assets/models/scene10.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Targets -->
        <a-entity mindar-image-target="targetIndex: 0" class="target-plane" data-scene="1">
            <a-gltf-model src="#model-1" scale="0.1 0.1 0.1" position="0 -0.4 0" animation-mixer="loop: repeat"></a-gltf-model>
        </a-entity>
        
        <a-entity mindar-image-target="targetIndex: 1" class="target-plane" data-scene="2">
            <a-gltf-model src="#model-2" scale="0.1 0.1 0.1" position="0 -0.4 0" animation-mixer="loop: repeat"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 2" class="target-plane" data-scene="3">
            <a-gltf-model src="#model-3" scale="0.1 0.1 0.1" position="0 -0.4 0" animation-mixer="loop: repeat"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 3" class="target-plane" data-scene="4">
            <a-gltf-model src="#model-4" scale="0.1 0.1 0.1" position="0 -0.4 0" animation-mixer="loop: repeat"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 4" class="target-plane" data-scene="5">
            <a-gltf-model src="#model-5" scale="0.1 0.1 0.1" position="0 -0.4 0" animation-mixer="loop: repeat"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 5" class="target-plane" data-scene="6">
            <a-gltf-model src="#model-6" scale="0.1 0.1 0.1" position="0 -0.4 0" animation-mixer="loop: repeat"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 6" class="target-plane" data-scene="7">
            <a-gltf-model src="#model-7" scale="0.1 0.1 0.1" position="0 -0.4 0" animation-mixer="loop: repeat"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 7" class="target-plane" data-scene="8">
            <a-gltf-model src="#model-8" scale="0.1 0.1 0.1" position="0 -0.4 0" animation-mixer="loop: repeat"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 8" class="target-plane" data-scene="9">
            <a-gltf-model src="#model-9" scale="0.1 0.1 0.1" position="0 -0.4 0" animation-mixer="loop: repeat"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 9" class="target-plane" data-scene="10">
            <a-gltf-model src="#model-10" scale="0.1 0.1 0.1" position="0 -0.4 0" animation-mixer="loop: repeat"></a-gltf-model>
        </a-entity>

    </a-scene>

    <audio id="bgm-audio" preload="auto"></audio>

    <script src="translations.js"></script>

    <script>
        const langMap = { 'en': 'BI', 'ms': 'BM', 'du': 'BKD' };
        const reverseLangMap = { 'BI': 'en', 'BM': 'ms', 'BKD': 'du' };

        let currentAudioLang = 'BI'; 
        let activeSceneIndex = null;
        const audioElement = document.getElementById('bgm-audio');
        
        document.addEventListener("DOMContentLoaded", () => {
            const storedLang = localStorage.getItem('preferredLanguage') || 'en';
            if (langMap[storedLang]) {
                currentAudioLang = langMap[storedLang];
                updateAudioUI(currentAudioLang);
                highlightLangBtn(storedLang);
            }

            // AR Events
            const targets = document.querySelectorAll('.target-plane');
            targets.forEach((target) => {
                target.addEventListener("targetFound", event => {
                    const sceneNum = target.getAttribute('data-scene');
                    console.log("Found Scene: " + sceneNum);
                    activeSceneIndex = sceneNum;
                    playAudio(sceneNum);
                });

                target.addEventListener("targetLost", event => {
                    console.log("Lost Target");
                    activeSceneIndex = null;
                    audioElement.pause();
                    audioElement.currentTime = 0;
                });
            });
            
            // Handle A-Frame loading
            const sceneEl = document.querySelector('a-scene');
            sceneEl.addEventListener('loaded', () => {
                console.log("A-Frame Scene Loaded");
            });
        });

        function highlightLangBtn(lang) {
            document.querySelectorAll('.audio-link-item').forEach(btn => btn.classList.remove('active-lang'));
            const btn = document.getElementById('lang-btn-' + lang);
            if(btn) btn.classList.add('active-lang');
        }

        function switchSiteLanguage(langCode) {
            if(typeof changeLanguage === 'function') {
                changeLanguage(langCode);
            }
            highlightLangBtn(langCode);
            
            if(langMap[langCode]) {
                currentAudioLang = langMap[langCode];
                updateAudioUI(currentAudioLang);
            }
        }

        function changeAudioLang(audioCode) {
            currentAudioLang = audioCode;
            updateAudioUI(audioCode);

            if(reverseLangMap[audioCode] && typeof changeLanguage === 'function') {
                changeLanguage(reverseLangMap[audioCode]);
                highlightLangBtn(reverseLangMap[audioCode]);
            }

            if (activeSceneIndex) {
                playAudio(activeSceneIndex);
            }
        }

        function updateAudioUI(code) {
            document.querySelectorAll('.ar-btn').forEach(btn => btn.classList.remove('active-lang'));
            
            if(code === 'BI') {
                document.getElementById('btn-audio-en')?.classList.add('active-lang');
                if(document.getElementById('audio-status')) document.getElementById('audio-status').innerText = "Audio: English";
            } else if(code === 'BM') {
                document.getElementById('btn-audio-ms')?.classList.add('active-lang');
                if(document.getElementById('audio-status')) document.getElementById('audio-status').innerText = "Audio: B. Melayu";
            } else {
                document.getElementById('btn-audio-du')?.classList.add('active-lang');
                if(document.getElementById('audio-status')) document.getElementById('audio-status').innerText = "Audio: Dusun";
            }
        }

        function playAudio(sceneNum) {
            if (!sceneNum) return;
            const src = `assets/sounds/${currentAudioLang}/SCENE ${sceneNum}-${currentAudioLang}.mp3`;
            audioElement.src = src;
            audioElement.play().catch(e => console.log("Audio play failed (interact first):", e));
        }

        function startAR() {
            const sceneEl = document.querySelector('a-scene');
            const loadingOverlay = document.getElementById('loading-overlay');
            
            if (sceneEl && sceneEl.systems['mindar-image-system']) {
                loadingOverlay.style.display = 'flex';
                
                // Slight delay to allow UI to render before heavy processing
                setTimeout(() => {
                    sceneEl.systems['mindar-image-system'].start().then(() => {
                        loadingOverlay.style.display = 'none';
                        document.getElementById('ar-ui').style.display = 'block';
                        document.body.classList.add('ar-active');
                    }).catch(err => {
                        console.error("AR Start Failed:", err);
                        loadingOverlay.style.display = 'none';
                        alert("Could not start Camera. Please allow permissions.");
                    });
                }, 100);
            } else {
                alert("AR System is not ready yet. Please wait a moment.");
            }
        }

        function stopAR() {
            const sceneEl = document.querySelector('a-scene');
            if (sceneEl && sceneEl.systems['mindar-image-system']) {
                sceneEl.systems['mindar-image-system'].stop();
            }
            document.getElementById('ar-ui').style.display = 'none';
            document.body.classList.remove('ar-active');
            audioElement.pause();
        }
    </script>
</body>
</html>
